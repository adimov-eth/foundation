name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # NON-BLOCKING (2026-07-05): this step had never actually executed — install was
      # red on a lockfile drift until PR #7, so the gate below it never ran. First real
      # run surfaced ~1200 pre-existing errors across 11 packages (rot, not regressions).
      # The sweep is tracked in the PR #7 follow-through plan (tracks D2/D4); flip this
      # back to blocking once `pnpm lint` is green at root.
      - name: Lint (non-blocking until the D4 rot sweep lands)
        run: pnpm lint
        continue-on-error: true
